# Xboard-RS High-Performance Single-Binary Deployment
services:
  xboard-rs:
    build:
      context: .
      dockerfile: Dockerfile
    image: xboard-rs:latest
    container_name: xboard-rs
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=7001
      - APP_NAME=Xboard
      - APP_KEY=base64:xboard_production_key_change_me!!
      - APP_URL=http://127.0.0.1:7001
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/data/xboard.db
      # Or uncomment below for MySQL:
      # - DB_CONNECTION=mysql
      # - DB_HOST=mysql
      # - DB_PORT=3306
      # - DB_DATABASE=xboard
      # - DB_USERNAME=root
      # - DB_PASSWORD=secret
      - RUST_LOG=xboard_rs=info,tower_http=info
    volumes:
      - ./data:/data
      - ./public:/app/public:ro
      - ./theme:/app/theme:ro
